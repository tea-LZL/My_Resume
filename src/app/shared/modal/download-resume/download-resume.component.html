<div class="resume-download-modal">
  <header class="resume-download-modal__header">
    <div>
      <p class="resume-download-modal__eyebrow">Resume / document settings</p>
      <h2 id="download-resume-title">Download your resume.</h2>
    </div>
    <button
      type="button"
      class="resume-download-modal__close"
      aria-label="Close download settings"
      (click)="dismiss()"
    >
      <span aria-hidden="true">×</span>
    </button>
  </header>

  <div class="resume-download-modal__body">
    <p class="resume-download-modal__intro">
      The PDF keeps the current editorial hierarchy, shared resume data, and selectable text.
    </p>

    <fieldset class="pdf-theme-options" [disabled]="isGenerating">
      <legend>PDF theme</legend>

      <label class="pdf-theme-option" [class.is-selected]="sTheme === 'dark'">
        <input type="radio" name="resume-pdf-theme" value="dark" [(ngModel)]="sTheme" />
        <span class="pdf-theme-option__swatch pdf-theme-option__swatch--dark" aria-hidden="true"></span>
        <span class="pdf-theme-option__content">
          <strong>Dark editorial</strong>
          <small>Everforest palette with soft green rules.</small>
        </span>
      </label>

      <label class="pdf-theme-option" [class.is-selected]="sTheme === 'light'">
        <input type="radio" name="resume-pdf-theme" value="light" [(ngModel)]="sTheme" />
        <span class="pdf-theme-option__swatch pdf-theme-option__swatch--light" aria-hidden="true"></span>
        <span class="pdf-theme-option__content">
          <strong>Paper light</strong>
          <small>Warm paper with the same editorial structure.</small>
        </span>
      </label>
    </fieldset>

    <label class="credential-option">
      <input type="checkbox" [(ngModel)]="bIncludeCredential" [disabled]="isGenerating" />
      <span>
        <strong>Append credential PDFs</strong>
        <small>Place the verified Azure credential documents after the resume.</small>
      </span>
    </label>

    @if (generationError) {
      <p class="resume-download-modal__error" role="alert">{{ generationError }}</p>
    }
  </div>

  <footer class="resume-download-modal__footer">
    <button type="button" class="resume-download-button" [disabled]="isGenerating" (click)="dismiss()">
      Cancel
    </button>
    <button
      type="button"
      class="resume-download-button resume-download-button--accent"
      [disabled]="isGenerating"
      (click)="downloadPDF()"
    >
      @if (isGenerating) {
        Generating…
      } @else {
        Download PDF
      }
    </button>
  </footer>
</div>
