@if (bNav) {
  <button
    type="button"
    class="site-nav__scrim"
    tabindex="-1"
    aria-hidden="true"
    (click)="closeNavMenu()"></button>
}

<header class="site-nav" [class.site-nav--scrolled]="isScrolled" [class.site-nav--menu-open]="bNav">
  <div class="site-nav__inner">
    <a class="site-nav__brand" routerLink="/" aria-label="Zhilong Liang home" (click)="closeNavMenu()">
      <span class="site-nav__mark" aria-hidden="true">ZL</span>
      <span>Zhilong Liang</span>
    </a>

    <nav class="site-nav__links" aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" appMagneticHover>
        Home
      </a>
      <a routerLink="/projects" routerLinkActive="is-active" appMagneticHover>Projects</a>
      <a routerLink="/resume" routerLinkActive="is-active" appMagneticHover>Resume</a>
      <a routerLink="/timeline" routerLinkActive="is-active" appMagneticHover>Timeline</a>
    </nav>

    <div class="site-nav__actions">
      <a class="site-nav__social-button" href="https://github.com/tea-LZL" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
        <i class="bi bi-github" aria-hidden="true"></i>
      </a>
      <a class="site-nav__social-button" href="https://gitlab.com/tea-LZL" target="_blank" rel="noopener noreferrer" aria-label="GitLab" title="GitLab">
        <i class="bi bi-gitlab" aria-hidden="true"></i>
      </a>
      <a class="site-nav__social-button" href="https://www.linkedin.com/in/zhilong-liang-748b641a1" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
        <i class="bi bi-linkedin" aria-hidden="true"></i>
      </a>
      <div class="theme-menu">
        <button
          type="button"
          class="theme-button"
          id="bd-theme"
          aria-haspopup="menu"
          aria-label="Choose color theme"
          data-bs-toggle="dropdown"
        >
          <i class="bi" [ngClass]="{ 'bi-circle-half': theme === 'auto', 'bi-moon-stars-fill': theme === 'dark', 'bi-sun-fill': theme === 'light' }" aria-hidden="true"></i>
          <span class="visually-hidden">Choose color theme</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme">
          <li><button type="button" class="dropdown-item" [class.active]="theme === 'light'" (click)="setTheme('light')">Light</button></li>
          <li><button type="button" class="dropdown-item" [class.active]="theme === 'dark'" (click)="setTheme('dark')">Dark</button></li>
          <li><button type="button" class="dropdown-item" [class.active]="theme === 'auto'" (click)="setTheme('auto')">Auto</button></li>
        </ul>
      </div>
    </div>

    <button
      type="button"
      class="site-nav__toggle"
      [class.is-open]="bNav"
      [attr.aria-expanded]="bNav"
      aria-controls="site-mobile-nav"
      [attr.aria-label]="bNav ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleNavMenu()"
    >
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
  </div>

  @if (bNav) {
    <div id="site-mobile-nav" class="site-nav__panel">
      <app-nav-modal (closed)="closeNavMenu()" />
    </div>
  }
</header>
