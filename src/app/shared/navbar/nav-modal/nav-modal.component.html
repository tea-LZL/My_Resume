<nav class="nav-menu" aria-labelledby="nav-menu-title">
  <p id="nav-menu-title" class="nav-menu__eyebrow">Menu</p>

  <ul class="nav-menu__links">
    <li>
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closed.emit()">
        Home
      </a>
    </li>
    <li>
      <a routerLink="/projects" routerLinkActive="is-active" (click)="closed.emit()">Projects</a>
    </li>
    <li>
      <a routerLink="/resume" routerLinkActive="is-active" (click)="closed.emit()">Resume</a>
    </li>
    <li>
      <a routerLink="/timeline" routerLinkActive="is-active" (click)="closed.emit()">Timeline</a>
    </li>
  </ul>

  <div class="nav-menu__meta">
    <div class="nav-menu__social">
      <a
        class="nav-menu__icon"
        href="https://github.com/tea-LZL"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        title="GitHub">
        <i class="bi bi-github" aria-hidden="true"></i>
      </a>
      <a
        class="nav-menu__icon"
        href="https://gitlab.com/tea-LZL"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitLab"
        title="GitLab">
        <i class="bi bi-gitlab" aria-hidden="true"></i>
      </a>
      <a
        class="nav-menu__icon"
        href="https://www.linkedin.com/in/zhilong-liang-748b641a1"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
        title="LinkedIn">
        <i class="bi bi-linkedin" aria-hidden="true"></i>
      </a>
    </div>

    <div class="nav-menu__theme" role="group" aria-label="Color theme">
      <button
        type="button"
        [class.is-active]="theme === 'light'"
        [attr.aria-pressed]="theme === 'light'"
        (click)="setTheme('light')">
        Light
      </button>
      <button
        type="button"
        [class.is-active]="theme === 'dark'"
        [attr.aria-pressed]="theme === 'dark'"
        (click)="setTheme('dark')">
        Dark
      </button>
      <button
        type="button"
        [class.is-active]="theme === 'auto'"
        [attr.aria-pressed]="theme === 'auto'"
        (click)="setTheme('auto')">
        Auto
      </button>
    </div>
  </div>
</nav>
